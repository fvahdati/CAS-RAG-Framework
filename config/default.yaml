project:
  name: CAS-RAG
  version: "1.0.0"

paths:
  resources: resources
  data: data
  prompts: resources/prompts
  prototypes: resources/prototypes
  scenarios: resources/scenarios

llm:
  provider: openai  # openai (ChatGPT) | gemini | ollama (local Llama/Meta); mock only with CAS_RAG_ALLOW_MOCK=1
  temperature: 0.1
  max_tokens: 1024

embedding:
  model: all-MiniLM-L6-v2
  metric_weights:
    cosine: 0.22
    euclidean: 0.14
    dot: 0.12
    manhattan: 0.10
    dice: 0.18
    pearson: 0.14
    exp_euclidean: 0.10

retrieval:
  top_k: 3
  chunk_size: 400

semantic:
  margin_explicit_vague: 0.12
  band_explicit_vague: 0.08

spacy:
  model: en_core_web_sm

human_verification:
  queue_file: data/human_verification_queue.json
  required: true

prompts:
  version: v1

pipelines:
  default_scenario_id: tutoring_social_experiment
