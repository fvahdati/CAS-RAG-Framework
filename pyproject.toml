[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cas-rag"
version = "1.0.0"
description = "CAS-RAG: Context-Aware Semantic Retrieval-Augmented Generation research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CAS-RAG Research Team" }]
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.2",
  "spacy>=3.7",
  "httpx>=0.26",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]
api = []
dashboard = ["streamlit>=1.30", "plotly>=5.18", "altair>=5.2"]
openai = ["openai>=1.10"]
gemini = ["google-generativeai>=0.3"]
all = ["cas-rag[dev,dashboard,openai,gemini]"]

[project.scripts]
cas-rag = "cas_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
